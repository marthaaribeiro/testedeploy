# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Deploy front-end no Azure Web App

on:
  push:
    branches:
      - 'main'
    paths-ignore:
      - 'back-end/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: Build do front
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: testedeploy-bgb7d5g8brh2g7a0.chilecentral-01.azurewebsites.net
          
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: dist

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9BA74EC714FB4EC98CC0CC4C5923D3E3 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_ECD6386CCDEA4C71ABD47421CC46872E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A8B081818EAE437A8FD66957A37FFC74 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'testedeploy-front'
          slot-name: 'Production'
          package: dist
          
